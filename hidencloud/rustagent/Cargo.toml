[package]
name = "hidencloud-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
machine-uid = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
